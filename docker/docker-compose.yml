version: '3.8'

# Distinct project name so this stack does not collide with the other
# razarion project (both compose dirs are named "docker").
name: controltheland

services:
  db:
    build: ./mysql-custom
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: gamedb
      MYSQL_USER: game
      MYSQL_PASSWORD: userpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: tomcat
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: gamedb
      DB_USER: game
      DB_PASS: userpass

volumes:
  db_data:
